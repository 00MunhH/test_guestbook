<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>관리자 로그인</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      max-width: 420px; margin: 0 auto; padding: 48px 24px; color: #222; background: #fafafa;
    }
    h1 { font-size: 20px; margin: 0 0 20px; }
    .card { background: #fff; padding: 24px; border-radius: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    label { display: block; font-size: 13px; color: #555; margin: 12px 0 6px; }
    input { width: 100%; border: 1px solid #ddd; border-radius: 8px; padding: 10px; font-size: 15px; }
    .btn { width: 100%; margin-top: 18px; padding: 11px; border: none; border-radius: 8px; background: #191600; color: #fff; font-size: 15px; cursor: pointer; }
    .error { background: #fff5f5; color: #c92a2a; padding: 10px 12px; border-radius: 8px; font-size: 13px; margin-bottom: 12px; }
    .note { color: #999; font-size: 12px; margin-top: 16px; text-align: center; }
    a { color: #3b5bdb; text-decoration: none; }
  </style>
</head>
<body>
  <h1>🔐 관리자 로그인</h1>
  <div class="card">
    {% if error %}
      <div class="error">아이디 또는 비밀번호가 올바르지 않습니다.</div>
    {% endif %}

    {% if enabled %}
      <form action="/auth/admin/login" method="post">
        <label for="username">아이디</label>
        <input type="text" id="username" name="username" autocomplete="username" required />
        <label for="password">비밀번호</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required />
        <button class="btn" type="submit">로그인</button>
      </form>
    {% else %}
      <div class="error">
        기본 관리자 계정이 설정되지 않았습니다. 서버의 <code>.env</code>에
        <code>ADMIN_USERNAME</code>, <code>ADMIN_PASSWORD</code>를 설정하세요.
      </div>
    {% endif %}

    <div class="note"><a href="/" class="back-link">← YJ</a></div>
  </div>
</body>
</html>
