<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>채팅방</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      max-width: 680px; margin: 0 auto; padding: 24px; color: #222; background: #fafafa;
    }
    header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    h1 { font-size: 22px; margin: 0; }
    a { color: #3b5bdb; text-decoration: none; }
    .back-link { font-weight: 600; font-size: 15px; }
    .card { background: #fff; border-radius: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.06); padding: 8px 14px; margin-bottom: 16px; }
    .create { display: flex; gap: 8px; }
    .create input { flex: 1; border: 1px solid #ddd; border-radius: 8px; padding: 10px; font-size: 14px; }
    .btn { padding: 9px 14px; border-radius: 8px; border: none; cursor: pointer; font-size: 14px; }
    .btn-primary { background: #191600; color: #fff; }
    .room { display: flex; align-items: center; gap: 10px; padding: 14px 4px; border-bottom: 1px solid #f3f3f3; text-decoration: none; color: inherit; }
    .room:last-child { border-bottom: none; }
    .room .avatar { width: 42px; height: 42px; border-radius: 12px; background: #e7f5ff; color: #1971c2; display: flex; align-items: center; justify-content: center; font-size: 18px; flex: none; }
    .room .name { font-weight: 600; }
    .room .sub { color: #999; font-size: 12px; }
    .empty { color: #aaa; text-align: center; padding: 30px 0; }
  </style>
</head>
<body>
  <header>
    <h1>💬 채팅방</h1>
    <nav><a href="/" class="back-link">← YJ</a></nav>
  </header>

  <div class="card">
    <form class="create" action="/chat/rooms" method="post">
      <input type="text" name="name" placeholder="새 채팅방 이름" required />
      <button class="btn btn-primary" type="submit">개설</button>
    </form>
  </div>

  <div class="card">
    {% for room in rooms %}
      <a class="room" href="/chat/{{ room.id }}">
        <div class="avatar">💬</div>
        <div>
          <div class="name">{{ room.name }}</div>
          <div class="sub">멤버 {{ room.memberships | length }}명 · 개설 {{ room.created_at | kst }}</div>
        </div>
      </a>
    {% else %}
      <div class="empty">아직 채팅방이 없습니다. 위에서 새 방을 만들어보세요.</div>
    {% endfor %}
  </div>
</body>
</html>
