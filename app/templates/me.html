<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>내 정보</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      max-width: 640px; margin: 0 auto; padding: 24px; color: #222; background: #fafafa;
    }
    header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
    h1 { font-size: 22px; margin: 0; }
    a { color: #3b5bdb; text-decoration: none; }
    .card { background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .profile { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
    .profile img { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; background: #ddd; }
    .profile .nick { font-weight: 600; }
    .profile .sub { color: #888; font-size: 13px; }
    .badge { display: inline-block; background: #ffe3e3; color: #c92a2a; font-size: 11px; padding: 2px 8px; border-radius: 999px; margin-left: 6px; }
    label { display: block; font-size: 13px; color: #555; margin: 14px 0 6px; }
    input[type=text], textarea {
      width: 100%; border: 1px solid #ddd; border-radius: 8px; padding: 10px; font-size: 15px;
    }
    textarea { min-height: 90px; resize: vertical; }
    .actions { margin-top: 16px; display: flex; gap: 8px; }
    .btn { display: inline-block; padding: 9px 16px; border-radius: 8px; border: none; cursor: pointer; font-size: 14px; text-decoration: none; }
    .btn-primary { background: #191600; color: #fff; }
    .btn-ghost { background: #eee; color: #333; }
    .saved-msg { background: #ebfbee; color: #2b8a3e; padding: 10px 12px; border-radius: 8px; font-size: 14px; margin-bottom: 16px; }
  </style>
</head>
<body>
  <header>
    <h1>내 정보</h1>
    <nav>
      <a href="/">← 방명록</a>
      {% if user.is_admin %} · <a href="/admin">관리자</a>{% endif %}
      · <a href="/auth/logout">로그아웃</a>
    </nav>
  </header>

  <div class="card">
    {% if saved %}
      <div class="saved-msg">✅ 저장되었습니다.</div>
    {% endif %}
    <div class="profile">
      {% if user.profile_image %}<img src="{{ user.profile_image }}" alt="프로필" />{% endif %}
      <div>
        <div class="nick">{{ user.shown_name }}
          {% if user.is_admin %}<span class="badge">관리자</span>{% endif %}
        </div>
        <div class="sub">카카오 닉네임: {{ user.nickname }} · 가입일 {{ user.created_at.strftime("%Y-%m-%d") }}</div>
      </div>
    </div>

    <form action="/me" method="post">
      <label for="display_name">표시 이름 (비우면 카카오 닉네임 사용)</label>
      <input type="text" id="display_name" name="display_name" value="{{ user.display_name }}" maxlength="128" placeholder="예: 홍길동" />

      <label for="bio">자기소개</label>
      <textarea id="bio" name="bio" placeholder="간단한 소개를 남겨보세요.">{{ user.bio }}</textarea>

      <div class="actions">
        <button class="btn btn-primary" type="submit">저장</button>
        <a class="btn btn-ghost" href="/">취소</a>
      </div>
    </form>
  </div>
</body>
</html>
