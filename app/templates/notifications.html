<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>알림</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      max-width: 640px; margin: 0 auto; padding: 24px; color: #222; background: #fafafa;
    }
    header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
    h1 { font-size: 22px; margin: 0; }
    a { color: #3b5bdb; text-decoration: none; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { background: #fff; padding: 14px 16px; border-radius: 10px; margin-bottom: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
    li.unread { border-left: 3px solid #fab005; }
    .msg { font-size: 14px; line-height: 1.5; }
    .time { color: #aaa; font-size: 12px; margin-top: 4px; }
    .empty { color: #999; text-align: center; padding: 40px 0; }
  </style>
</head>
<body>
  <header>
    <h1>🔔 알림</h1>
    <nav><a href="/">← 방명록</a> · <a href="/me">내 정보</a></nav>
  </header>

  <ul>
    {% for n in items %}
      <li class="{% if not n.is_read %}unread{% endif %}">
        <div class="msg">
          {% if n.entry_id %}
            <a href="/#entry-{{ n.entry_id }}">{{ n.message }}</a>
          {% else %}
            {{ n.message }}
          {% endif %}
        </div>
        <div class="time">{{ n.created_at.strftime("%Y-%m-%d %H:%M") }}</div>
      </li>
    {% else %}
      <li class="empty">알림이 없습니다.</li>
    {% endfor %}
  </ul>
</body>
</html>
