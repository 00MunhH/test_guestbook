# app01 — EC2 + Docker + EFS
# EC2 호스트에 EFS를 /mnt/efs 로 마운트한 뒤, 그 안의 guestbook 디렉터리를
# 컨테이너 /data 에 bind mount 한다.
#   EC2 운영:  EFS_DATA_DIR=/mnt/efs/guestbook docker compose up -d --build
#   로컬 테스트: EFS_DATA_DIR=./data        docker compose up -d --build
services:
  web:
    build: .
    image: guestbook-app01:latest
    container_name: guestbook-app01
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:////data/guestbook.db
      UPLOAD_DIR: /data/uploads
    volumes:
      # 호스트의 EFS 마운트 경로(기본값은 로컬 ./data) → 컨테이너 /data
      - ${EFS_DATA_DIR:-./data}:/data
    restart: unless-stopped
